# SPDX-License-Identifier: GPL-3.0-only
# Music codec asked of the phone: 0 PCM, 2 AAC-LC, 4 AAC-LC with ADTS
media_audio_codec=2

# Keep phone navigation activity out of the stock HMI: 0 off, 1 on
aa_suppress_navigation_active=0

# Main display density sent to the phone: 0 gal's own | dpi (160 = widescreen layout)
main_dpi=160
# Main display frame rate: 0 gal's list | 30 offer 30 fps only
main_fps=30

cluster
# 0=direct MOST; 2=opt-in head-unit decode through cluster-video.
cluster_output=0
# Cluster density, dpi
cluster_density=133
# Cluster viewing distance, mm
cluster_viewing_distance=550
# Window margins per side, px (-1 = split the total margin evenly)
cluster_margin_bottom=48
# Left window margin, px (-1 = split the total margin evenly)
cluster_margin_left=32
# Right window margin, px (-1 = split the total margin evenly)
cluster_margin_right=32
# Keep-out insets inside the window, px
cluster_content_inset_left=80
# Right keep-out inset inside the window, px
cluster_content_inset_right=80
# Cluster frames the phone may send before an ack: 1..64
cluster_max_unacked=8
# Wait after the nav encoder closes, gate released by the handover object, ms
cluster_handover_settle_ms=5000
# Wait after the nav encoder closes, gate released on uptime, ms
cluster_ready_settle_ms=5000
# Longest wait of a partly filled isoTX2 block before it is padded and sent, ms
cluster_flush_max_hold_ms=400
# Circuit breaker trips on one isoTX2 write blocking this long, ms (0 off)
cluster_cb_hard_stall_ms=2500
# Focus kick (fresh IDR) after a drained writer backlog: 0 | 1
cluster_focus_kick=1
# Focus kick: no kick before the stream ran this long, ms
cluster_focus_kick_grace_ms=15000
# Focus kick: writer ring depth that counts as a backlog, frames
cluster_focus_kick_wq=16
# Focus kick: ring must stay drained this long, ms
cluster_focus_kick_settle_ms=1500
# Focus kick: minimum time between kicks, ms
cluster_focus_kick_min_ms=20000
# Focus kick: most kicks per session
cluster_focus_kick_max=3

sensor
# Present the unit as Google's Desktop Head Unit (development head unit): 0 | 1
identify_as_dhu=1
# Advertise sensor type 23 only with a user-supplied ev_model.bin: 0 | 1
sensor_ev_advertise=0
# Send the EV model; requires a user-supplied ev_model.bin: 0 | 1
sensor_ev_send=0
# Usable battery capacity for SoC to Wh, Wh
sensor_ev_capacity_wh=28500
# Send raw_ev_trip.bin as sensor type 26: 0 | 1
sensor_raw_ev_trip=0
